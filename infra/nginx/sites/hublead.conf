# ============================================
# Hub Leads — Server Block
# Domínio: hublead.pradodacostasolucoes.com.br
# ============================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hublead.pradodacostasolucoes.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hublead.pradodacostasolucoes.com.br;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/hublead.pradodacostasolucoes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hublead.pradodacostasolucoes.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hublead.pradodacostasolucoes.com.br/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/hublead-access.log main;
    error_log /var/log/nginx/hublead-error.log warn;

    # ============================================
    # Rota / → PWA estático
    # ============================================
    root /var/www/hublead;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache de assets estáticos
        location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Service Worker não pode ter cache
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
        }
    }

    # ============================================
    # Rota /api/ → PocketBase (porta 8090)
    # ============================================
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ============================================
    # Rota /_/ → PocketBase Admin UI
    # ============================================
    location /_/ {
        proxy_pass http://127.0.0.1:8090/_/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Rota /evolution/ → Evolution API (porta 8080)
    # ============================================
    location /evolution/ {
        rewrite ^/evolution/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        client_max_body_size 10m;
    }
}