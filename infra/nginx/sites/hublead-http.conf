# ============================================
# Hub Leads — Server Block TEMPORARIO (HTTP only)
# Usado na FASE 11, antes da emissao do SSL.
# O setup_ssl() substitui este arquivo pelo hublead.conf (HTTPS).
# server_name __DOMAIN__ e substituido pelo sed no install.sh.
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Desafio ACME do certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        root /var/www/hublead;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- /api/ → PocketBase (porta 8090) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ---- /_/ → PocketBase Admin UI ----
    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- /evolution/ → Evolution API (porta 8080) ----
    location /evolution/ {
        rewrite ^/evolution/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        client_max_body_size 10m;
    }
}
