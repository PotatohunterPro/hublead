name: hubleads

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: hubleads-pocketbase
    restart: unless-stopped
    volumes:
      - pb-data:/pb_data
      - pb-public:/pb_public
      - ../pb_hooks:/pb_hooks:ro
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
    command:
      - "--dir=/pb_data"
      - "--publicDir=/pb_public"
      - "--hooksDir=/pb_hooks"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - hubleads-net

networks:
  hubleads-net:
    name: hubleads-network
    driver: bridge

volumes:
  pb-data:
    name: hubleads-pb-data
  pb-public:
    name: hubleads-pb-public
